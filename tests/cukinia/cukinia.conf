# Functional tests of a microduck image (cukinia 0.9.1). Shell, sourced by cukinia.
# Hardware checks sit in a plain `if`: cukinia's `when` still runs a skipped command.
here=$(dirname "$config_file")

on_board() { grep -q microduck /proc/device-tree/model 2>/dev/null; }

logging suite "system"

if on_board; then
	cukinia_systemd_failed
else
	# In QEMU these need absent hardware: RK809, a USB controller, the U-Boot environment.
	as "No failed units, except the three that need board hardware" cukinia_cmd sh -c '
		! systemctl --failed --no-legend --plain | awk "{ print \$1 }" |
			grep -vxE "microduck-(audio-path|usb-gadget|slot-health)\.service"'
fi
for unit in updaterd configd btd NetworkManager; do
	cukinia_systemd_unit "$unit"
done
for sock in updaterd configd robotd; do
	as "/run/$sock.sock is there" cukinia_test -S "/run/$sock.sock"
done
as "robotctl runs" cukinia_cmd robotctl --version
cukinia_group robot
# Everything persistent lives there. cukinia_mount wants the device, which differs per board.
as "Data partition is mounted on /var/lib/robot" \
	cukinia_cmd sh -c 'awk "\$2 == \"/var/lib/robot\" { found = 1 } END { exit !found }" /proc/mounts'

# The shipping image: its fstab says `/` is read-only (the build checks it), and
# writable state must live on data or in RAM (docs/agents/rauc.md, "Read-only rootfs").
if awk '$2 == "/" && $4 ~ /(^|,)ro(,|$)/ { f = 1 } END { exit !f }' /etc/fstab; then
	as "/ is mounted read-only" cukinia_cmd sh -c \
		'awk "\$2 == \"/\" { o = \$4 } END { exit o !~ /^ro(,|\$)/ }" /proc/mounts'
	as "/etc/resolv.conf points into /run" cukinia_cmd sh -c \
		'case "$(readlink -f /etc/resolv.conf)" in /run/*) ;; *) exit 1 ;; esac'
	as "timesyncd's clock file is on the data partition" cukinia_cmd sh -c \
		'awk "\$2 == \"/var/lib/systemd/timesync\" { f = 1 } END { exit !f }" /proc/mounts'
	as "RAUC mounts bundles under /run/rauc" \
		cukinia_cmd grep -qsx 'mountprefix=/run/rauc' /etc/rauc/system.conf /usr/lib/rauc/system.conf
	as "Daemon updates are off: pinned, never applied" cukinia_cmd sh -c \
		'grep -qx "auto_apply = \"off\"" /etc/robot/updater.toml && grep -q "^pinned = " /etc/robot/updater.toml'
fi

# oe-core defaults removed in microduck.conf. dnsmasq stays installed for NetworkManager.
for unit in rpcbind avahi-daemon dnsmasq busybox-syslog syslog; do
	as "$unit is not enabled" not cukinia_cmd systemctl is-enabled --quiet "$unit"
done

# updaterd will want it; a hanging NetworkManager-wait-online would stall it.
as "network-online.target can be reached" cukinia_cmd timeout 60 systemctl start network-online.target
as "Wi-Fi regulatory database is installed" cukinia_test -f /lib/firmware/regulatory.db

as "Only the image's ports listen off loopback" verbose cukinia_cmd "$here/ports.sh"
as "os-release's build is the bundle RAUC installed" verbose cukinia_cmd "$here/stamp.sh"
# TODO: re-enable once the WQ9201S driver's "BUG: spinlock bad magic" (wq_wlan,
# ieee80211_recv_bar, once per boot) is fixed: it fails every board run today.
# as "Kernel log has no oops, BUG or panic" verbose cukinia_cmd sh -c '
# 	hits=$(dmesg | grep -E "Oops|BUG:|Kernel panic|Unable to handle kernel" | head -3)
# 	[ -z "$hits" ] || { echo "$hits" | tr "\n" ";"; echo; exit 1; }'

# mediad fails at run time on a missing one. Keep in step with packagegroup-microduck-media.
for plugin in app coreelements debugutilsbad dtls nice rockchipmpp rsrtp rswebrtc rtp \
	rtpmanager sctp srtp video4linux2 videoconvertscale videofilter videoparsersbad \
	videorate videotestsrc webrtc; do
	as "GStreamer plugin $plugin registers" cukinia_cmd gst-inspect-1.0 "$plugin"
done

# Without it robotd starts but cannot walk. ort loads ORT_DYLIB_PATH, else the bare .so.
for unit in robotd mediad; do
	as "The ONNX Runtime $unit loads is installed" cukinia_cmd sh -c '
		ort=$(systemctl show -p Environment "$1" | tr " " "\n" | sed -n "s/^ORT_DYLIB_PATH=//p")
		[ -e "/usr/lib/${ort:-libonnxruntime.so}" ]' sh "$unit"
done

# The duck detector's NPU runtime; the Zero 3W's NPU is off. The image sets [board].
board=$(sed -n '/^\[board\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' /etc/robot/robotd.toml)
if [ "$board" != zero3 ]; then
	as "The NPU runtime (librknnrt) is installed for ${board:-?}" cukinia_test -e /usr/lib/librknnrt.so
fi

if on_board; then
	logging suite "hardware"

	for unit in robotd mediad nfcd tofd; do
		cukinia_systemd_unit "$unit"
	done

	# Fails on any missing servo or IMU board; run.sh keeps its output.
	as "Robot is healthy: servos, IMU board, control loop" \
		cukinia_cmd robotctl health
	as "Head IMU (LSM6DSV16X, i2c-3 0x6a) answers WHO_AM_I 0x70" \
		cukinia_cmd sh -c '[ "$(i2cget -y 3 0x6a 0x0f)" = 0x70 ]'
	# nfcd logs this only after checking the chip's IC identity.
	as "NFC reader (ST25R100) is up" \
		cukinia_cmd sh -c 'journalctl -b -u nfcd | grep -q "reader up"'
	# Present and bound; its content is provisioning, not the image. (ToF: board-report.py.)
	as "Identity EEPROM (i2c-1 0x50) is there, driven by at24" cukinia_i2c 1 0x50 at24
	as "Wi-Fi driver (wq_wlan) is loaded" cukinia_kmod wq_wlan
	as "Duck detector model runs on the NPU" \
		verbose cukinia_cmd "$here/hw/npu.sh"
	as "Camera gives a full frame, not black, not flat, through mediad" \
		verbose cukinia_cmd "$here/hw/camera.sh"
	as "Fan spins at full duty" \
		verbose cukinia_cmd "$here/hw/fan.sh"
	as "Speaker plays a 500 Hz tone and the face mic hears it" \
		verbose cukinia_cmd "$here/hw/mic-speaker.sh"
else
	cukinia_log "not a microduck board: hardware checks not run"
fi
