name: build-image

# Builds the microduck image on Hugging Face Jobs and reports the result.
#
# GitHub runs the orchestration, not the build. That is not a preference, it is
# arithmetic: a hosted runner has 4 cores, 16 GB RAM and ~14 GB of free disk,
# while this build wants 32 cores and its sstate cache alone is 48 GB. The
# Actions cache tops out at 10 GB per repository, so the one thing that must
# persist between builds cannot live there. On HF Jobs the same build takes ~6
# minutes of bitbake at 99% sstate reuse and costs about $1.60.
#
# By default it builds microduck-bundle: the dev-signed RAUC bundle, plus, since
# the bundle depends on the image's do_image_complete, the dev image's .wic. So
# every merge yields both a card to flash and an update to `rauc install`. It
# also builds microduck-bundle-shipping, the shipping image in a bundle, also
# dev-signed: the release candidate that promote-os.yml can re-sign for stable.
#
# HF_TOKEN launches the job AND reaches the bucket, because the bucket is mounted
# into the job by the platform as the org. RAUC_DEV_KEY / RAUC_DEV_CERT (the PEM
# files from README.md "Signing keys") are the one credential
# that does enter the build: the bundle is signed inside the job. That is fine for
# the DEV key, which robots in the field must never trust. A production key must
# not take this path: sign releases with `rauc resign` in a separate job instead.
#
# Artifacts stay in the bucket, which is already private and already where the
# build wrote them. This publishes the hf:// URL instead. They are kept for
# KEEP_DAYS (see the prune step), and the card image is the compressed
# .wic.zst + .wic.bmap; the 13 GB plain .wic is not uploaded.
#
# Publishing a GitHub release builds every board from its tag and attaches what
# a person needs to flash or update one to the release itself (see the attach
# step), so a tagged version never needs the bucket or a rebuild.

on:
  workflow_dispatch:
    inputs:
      kas_command:
        description: "kas command (build, or checkout to validate the pipeline cheaply)"
        type: choice
        options: [build, checkout]
        default: build
      target:
        description: "recipe to build, e.g. linux-rockchip (empty = dev image .wic + dev and shipping bundles)"
        type: string
        default: ""
      machine:
        description: "board: the Zero 3W stand-in, the beta board, or the beta with the V1.0 face board"
        type: choice
        options: [microduck-zero3, microduck-beta, microduck-face-board-v1]
        default: microduck-zero3
      flavor:
        description: "HF Jobs hardware flavor"
        type: choice
        options: [cpu-performance, cpu-basic]
        default: cpu-performance
      publish:
        description: "publish the bundle for OS updates: to dev from main, to dev-<branch> from a branch"
        type: boolean
        default: false
  release:
    types: [published]
  push:
    branches: [main]
    # Only what can change the image. A README edit should not spend $1.60.
    # Markdown is excluded even inside the layers: their README.md and SECURITY.md
    # are documentation, and no recipe installs a .md file. A push that also
    # touches a recipe still builds.
    paths:
      - "meta-microduck*/**"
      - "kas/**"
      - "scripts/build-hfjob.sh"
      - ".github/workflows/build-image.yml"
      - "!**/*.md"

# Queue rather than cancel. Cancelling mid-build would leave the HF job running
# and billing, and the cleanup step below only fires for jobs this run started.
#
# One queue per branch: main's builds still run in order, but a branch no longer
# waits for main or for another branch (each did, for about an hour, on
# 2026-10-05). Running side by side is safe for two reasons:
# - each job uploads its inputs to a folder of its own (build-hfjob.sh)
# - the shared cache is only written atomically, under content-addressed names
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The build is ~50 min warm and hours cold; this is a backstop, not a target.
    timeout-minutes: 240
    # contents: write is for attaching images to a release; nothing else writes.
    permissions:
      contents: write
    # A push or a release builds every board; a manual run builds the one it
    # names. Not fail-fast: a red beta must not cancel a Zero 3W build that is
    # fine (and a cancelled run leaves its HF job to the cancel step, not to luck).
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ github.event_name != 'workflow_dispatch' && fromJSON('["microduck-zero3","microduck-beta","microduck-face-board-v1"]') || fromJSON(format('["{0}"]', inputs.machine)) }}

    # `shell: bash` runs every step as `bash --noprofile --norc -eo pipefail`,
    # and the pipefail is the point. GitHub's default is `bash -e`, under which a
    # failing command in a pipeline is invisible: `scripts/wait-hfjob.sh | tee`
    # takes its exit status from tee, so the step goes green no matter what the
    # script decided. That is exactly how run 34837726446 reported success while
    # wait-hfjob.sh had failed to execute at all -- the same false-green this
    # workflow exists to prevent, reintroduced one level up.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # >= 1.30 for bucket volume mounts in `hf jobs run`.
      - name: Install the Hugging Face CLI
        run: pip install --quiet "huggingface_hub[cli]>=1.30"

      - name: Launch the build on HF Jobs
        id: launch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HFJOB_TARGET: ${{ inputs.target || 'microduck-bundle microduck-bundle-shipping' }}
          # The matrix above picks the board: both on a push or a release.
          HFJOB_MACHINE: ${{ matrix.machine }}
          HFJOB_FLAVOR: ${{ inputs.flavor || 'cpu-performance' }}
          RAUC_DEV_KEY: ${{ secrets.RAUC_DEV_KEY }}
          RAUC_DEV_CERT: ${{ secrets.RAUC_DEV_CERT }}
        run: |
          set -eu
          # build-hfjob.sh reads the pair from files, and only sends it to a
          # bundle job. If a secret is missing the file is empty and the script
          # refuses before launching, instead of failing in do_bundle 45 min in.
          umask 077
          # sed '$a\' restores a final newline a pasted PEM may have lost, and
          # leaves an empty secret empty.
          printf '%s' "$RAUC_DEV_KEY" | sed '$a\' > "$RUNNER_TEMP/rauc.key.pem"
          printf '%s' "$RAUC_DEV_CERT" | sed '$a\' > "$RUNNER_TEMP/rauc.cert.pem"
          export HFJOB_RAUC_KEY="$RUNNER_TEMP/rauc.key.pem" HFJOB_RAUC_CERT="$RUNNER_TEMP/rauc.cert.pem"
          out=$(scripts/build-hfjob.sh "${{ inputs.kas_command || 'build' }}" 2>&1 | tee /dev/stderr)
          # Parse the id out of the job URL, not out of `id=...`. The CLI prints
          # two different shapes depending on where it runs -- `id=<hex> name=...`
          # in one place and an indented, ANSI-coloured `  id: <hex>` in another --
          # and the first run of this workflow died on exactly that. The URL line
          # carries the id in both, so match that and strip colour first.
          id=$(printf '%s\n' "$out" \
                | sed -e 's/\x1b\[[0-9;]*m//g' \
                | grep -oE 'jobs/[^/[:space:]]+/[A-Za-z0-9]{16,}' \
                | head -1 | sed 's|.*/||')
          test -n "$id" || { echo "could not parse a job id from build-hfjob.sh"; exit 1; }
          echo "parsed job id: $id"
          echo "job_id=$id" >> "$GITHUB_OUTPUT"
          echo "Launched https://huggingface.co/jobs/pollen-robotics/$id" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$out" | grep -E '^daemon: ' >> "$GITHUB_STEP_SUMMARY" || true
          # The pinned release (build-hfjob.sh), for the release notes.
          printf '%s\n' "$out" | grep -m1 -E '^daemon: [^ ]+ at ' | sed 's/^/daemon=/' >> "$GITHUB_OUTPUT" || true

      # Judges the build on its logs, never on its exit status -- see the long
      # explanation at the top of wait-hfjob.sh. Every green build of this image
      # so far has reported ERROR, so `hf jobs wait` would fail all of them.
      - name: Wait for it, and decide whether it actually worked
        id: wait
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          scripts/wait-hfjob.sh "${{ steps.launch.outputs.job_id }}" | tee /tmp/verdict.txt
          grep -oE '^artifacts=.*' /tmp/verdict.txt >> "$GITHUB_OUTPUT" || true

      - name: Publish what was built
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          prefix="${{ steps.wait.outputs.artifacts }}"
          # Guard, because an empty prefix means the wait step did not produce a
          # verdict and we would otherwise "publish" nothing while staying green.
          test -n "$prefix" || { echo "no artifacts prefix from the wait step"; exit 1; }
          echo "### Image built" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          hf buckets ls "$prefix/" | grep -E "rootfs-[0-9]+\.wic|bundle-.*-[0-9]+\.raucb|zboot\.img--|\.manifest$" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts: \`$prefix\`" >> "$GITHUB_STEP_SUMMARY"

      # A release carries its own images: the bucket's copies are pruned after
      # KEEP_DAYS, a release's assets are not. The repository is private, so its
      # assets are too. Names already say the machine, except the loader, which
      # goes up as <machine>-loader.bin: it is what `rkdeveloptool db` needs for a
      # beta main board in maskrom (docs/agents/beta-board.md), face board V1.0
      # included. Not the Zero 3W's: that one is flashed as a card.
      - name: Attach the image to the release
        if: success() && github.event_name == 'release'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          MACHINE: ${{ matrix.machine }}
          DAEMON: ${{ steps.launch.outputs.daemon }}
        run: |
          set -eu
          prefix="${{ steps.wait.outputs.artifacts }}"
          test -n "$prefix" || { echo "no artifacts prefix from the wait step"; exit 1; }
          mkdir "$RUNNER_TEMP/assets" && cd "$RUNNER_TEMP/assets"
          # The dev image and the dev bundle only. The job also built the shipping
          # image and its bundle, but those reach a release through promote-os.yml,
          # production-signed, in the release microduck-os-v<X.Y.Z>.
          hf buckets ls "$prefix/" | awk '{print $NF}' \
            | grep -E "/microduck-image-dev-$MACHINE\.rootfs-[0-9]+\.(wic\.zst|wic\.zst\.sha256sum|wic\.bmap|manifest)\$|/microduck-bundle-$MACHINE-[0-9]+\.raucb\$|/loader\.bin-" \
            | while read -r p; do
                hf buckets cp "hf://buckets/pollen-robotics/microduck-yocto-cache/$p" "./${p##*/}"
              done
          if [ "$MACHINE" = microduck-zero3 ]; then
            rm -f loader.bin-*
          else
            mv loader.bin-* "$MACHINE-loader.bin"
          fi
          # A missing .raucb or .bmap must not publish a release that looks complete.
          want=6; [ "$MACHINE" = microduck-zero3 ] && want=5
          [ "$(ls | wc -l)" -eq "$want" ] || { echo "expected $want assets, got:"; ls -l; exit 1; }
          sha256sum -c *.wic.zst.sha256sum
          gh release upload "$TAG" * --clobber -R "$GITHUB_REPOSITORY"
          echo "Attached to release $TAG:" >> "$GITHUB_STEP_SUMMARY"
          ls -l >> "$GITHUB_STEP_SUMMARY"
          # The notes say which daemon the image seeds (the recipe's pin).
          # Both legs edit the same notes: re-read after writing, since a
          # concurrent edit from the other leg can overwrite this line.
          if [ -z "$DAEMON" ]; then
            echo "::warning::no daemon line from the launch step; release notes not updated"
            exit 0
          fi
          line="$MACHINE $DAEMON"
          for _ in 1 2 3; do
            notes=$(gh release view "$TAG" --json body -q .body -R "$GITHUB_REPOSITORY")
            case "$notes" in *"$line"*) exit 0 ;; esac
            gh release edit "$TAG" --notes "$notes"$'\n\n'"$line" -R "$GITHUB_REPOSITORY"
            sleep $((RANDOM % 10 + 1))
          done
          gh release view "$TAG" --json body -q .body -R "$GITHUB_REPOSITORY" | grep -qF "$line" \
            || echo "::warning::could not add '$line' to the release notes"

      # OS updates: both bundles into the public pollen-robotics/microduck-os
      # bucket, where microduck-osupdate on a robot finds them (scripts/publish-os.sh
      # says what goes where). Every push to main publishes the dev bundle to `dev`
      # and the shipping one to `candidate`; a manual run with `publish` does the
      # same from main, and `dev-<branch>` / `candidate-<branch>` from a branch.
      #
      # The channel is derived, never typed: nothing here can write `stable`. Only
      # promote-os.yml does, with a `candidate` build it re-signs with the
      # production key -- robots in the field must never follow a dev-signed image.
      # Both bundles here are dev-signed, so a production board refuses either.
      #
      # A release does not publish; it attaches its images instead (the step above).
      - name: Publish for OS updates
        if: >-
          success() && !inputs.target
          && (inputs.kas_command || 'build') == 'build'
          && (github.event_name == 'push' || inputs.publish)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          if [ "$GITHUB_REF_NAME" = main ]; then
            dev=dev candidate=candidate
          else
            # <channel>-<branch>, in the bucket's [a-z0-9-] alphabet, 40 characters at most.
            slug=$(printf '%s' "$GITHUB_REF_NAME" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9-]/-/g')
            dev=dev-$(printf '%s' "$slug" | cut -c1-36)
            candidate=candidate-$(printf '%s' "$slug" | cut -c1-30)
          fi
          job="${{ steps.launch.outputs.job_id }}" machine="${{ matrix.machine }}"
          scripts/publish-os.sh "$job" "$machine" "$dev" | tee -a "$GITHUB_STEP_SUMMARY"
          BUNDLE=microduck-bundle-shipping scripts/publish-os.sh "$job" "$machine" "$candidate" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Retention. Nothing reads deploy/<job>/ except a person fetching a card
      # image or a bundle. A folder goes only if it is BOTH older than KEEP_DAYS
      # and not among the KEEP_LAST newest. The second rule is for quiet spells:
      # after weeks without builds, the first one back must not leave its own
      # folder as the only artifact in the bucket. Before this step, nothing ever
      # deleted these folders: 665 GB in 26 of them on 2026-10-06. A folder's date
      # is the one `hf buckets ls` prints for it (date and time, so they sort).
      #
      # Non-fatal. A prune that fails must not turn a good build red, but it
      # warns.
      - name: Prune old artifacts
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KEEP_DAYS: 14
          KEEP_LAST: 5
        run: |
          set -u
          cutoff=$(date -u -d "$KEEP_DAYS days ago" +%F)
          hf buckets ls hf://buckets/pollen-robotics/microduck-yocto-cache/deploy/ \
            | awk '$NF ~ /^deploy\/.+\/$/ {print $1, $2, $NF}' \
            | sort -r | tail -n +"$((KEEP_LAST + 1))" \
            | awk -v c="$cutoff" '$1 < c {print $3}' \
            | while read -r dir; do
                echo "pruning $dir (older than $cutoff)"
                hf buckets rm -R -y "hf://buckets/pollen-robotics/microduck-yocto-cache/$dir" \
                  || echo "::warning::could not prune $dir"
              done

      # A run that ends without reaching a terminal job state leaves the job
      # running and billing by the minute. Failure counts, not just cancellation:
      # the first run of this workflow died parsing the job id *after* launching
      # a job, which orphaned it. Cancelling an already-terminal job is a no-op,
      # so this is safe to fire on both. Targeted at the one id this run started
      # -- the org's job namespace is shared, and a broader sweep would kill
      # someone else's training run.
      #
      # --namespace is load-bearing and was missing at first: `hf jobs cancel`
      # looks the job up under the *token owner's* namespace by default, so it
      # returned 404 "Job Not Found for url: .../jobs/<user>/<id>" while
      # the job ran on happily under pollen-robotics. The `|| true` then hid that,
      # and the step reported success having cancelled nothing.
      #
      # The failure is still non-fatal -- this runs on an already-failing path and
      # masking the original error would be worse -- but it is now loud, because
      # a silent failure here costs $1.90/h until somebody notices.
      - name: Cancel the HF job if this run did not finish cleanly
        if: (failure() || cancelled()) && steps.launch.outputs.job_id != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          id="${{ steps.launch.outputs.job_id }}"
          if hf jobs cancel "$id" --namespace pollen-robotics; then
            echo "cancelled $id"
          else
            echo "::warning::could not cancel HF job $id - it may still be running and billing."
            echo "::warning::check: hf jobs ps --namespace pollen-robotics"
          fi
