name: slot-health

# Runs scripts/test-slot-health.sh: every verdict microduck-slot-health can reach,
# against a fake /sys and stubbed systemctl/uname/rauc; and scripts/test-slot-trial.sh:
# when microduck-slot-trial ends a slot's trial and what it remembers, against a stubbed
# U-Boot environment. Under a second each, no Yocto checkout. Twice, because the script runs under the image's /bin/sh, and dash is the
# strictest POSIX shell a hosted runner has.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-slot-health.sh
      - run: TEST_SH=dash scripts/test-slot-health.sh
      - run: scripts/test-slot-trial.sh
      - run: TEST_SH=dash scripts/test-slot-trial.sh
      - run: scripts/test-osupdate-boot-report.sh
      - run: TEST_SH=dash scripts/test-osupdate-boot-report.sh
      - run: scripts/test-data-grow.sh
      - run: TEST_SH=dash scripts/test-data-grow.sh
