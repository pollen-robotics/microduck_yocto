# No networking in U-Boot. It has nothing to use it with -- both RK3566 GMACs are
# disabled in every microduck DT, there is no USB-Ethernet driver, and the boot
# script never touches the network -- and the stack is where most of this U-Boot's
# known CVEs are (NFS, TFTP, BOOTP/DHCP, TCP, IP defrag). CMD_NET (bootp, tftpboot)
# selects NET, so both lines are needed: NET alone is switched back on by
# olddefconfig. Checked on a build: no network function is left in the u-boot ELF.
# CONFIG_CMD_NET is not set
# CONFIG_NET is not set
