#@TYPE: Machine
#@NAME: microduck under QEMU
#@DESCRIPTION: The face-board-v1 image and kernel on QEMU's virt board, for runqemu.

# The runqemu settings are in microduck-qemuboot.inc, shared by every RK3566 board;
# this machine only names the face board's build for QEMU. Same packages, kernel
# config and tune, so most of sstate is shared.
MACHINEOVERRIDES =. "microduck-face-board-v1:"
require conf/machine/microduck-face-board-v1.conf
