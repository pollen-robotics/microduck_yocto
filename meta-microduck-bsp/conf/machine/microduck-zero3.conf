#@TYPE: Machine
#@NAME: microduck on Radxa Zero 3W
#@DESCRIPTION: RK3566, Cortex-A55. Stand-in for the custom microduck PCB.

# Brings tune-cortexa55, rockchip-common.inc (vendor BSP 6.1 kernel,
# u-boot-rockchip), mali bifrost-g52, RK_SOC_FAMILY=rk3568, RK_ISP_VERSION=2.1.
require conf/machine/include/rk356x.inc
require conf/machine/include/microduck-common.inc

# This board has the AICSemi AIC8800DS2 (SDIO wifi/BT combo), not the Broadcom
# AP6212. Pinned to the single matching device tree on purpose: with more than one
# entry, linux-rockchip.inc derives a Rockchip boot.img target per DTB but only
# one boot.img gets deployed, so which variant it carries is ambiguous.
KERNEL_DEVICETREE = "rockchip/rk3566-radxa-zero-3w-aic8800ds2.dtb"

# Same as rockchip-rk3566-evb.conf: meta-rockchip's u-boot-rockchip is Rockchip
# downstream U-Boot 2017.09, built via `make.sh rk3568` with DRAM init coming
# from rkbin's TPL -- which is SoC-level, not board-level. That is the only
# combination meta-rockchip actually tests, so start there and change nothing.
#
# Tested on the board 2026-09-10, SD card, no serial attached. Verified: the
# bootrom accepts the idbloader from the card (no maskrom fallback with the card
# in, maskrom without it), and the kernel has no cmdline from ANY source -- the
# U-Boot default env has no bootargs, the boot.img header cmdline is empty,
# CONFIG_CMDLINE is unset, and radxa's dts deletes the chosen node Rockchip's
# rk3568-linux.dtsi provides (their own U-Boot supplies bootargs from
# extlinux.conf). Observed: LED lights then freezes off, nothing written to the
# card, /etc/machine-id still empty. Inferred, not seen: the kernel started and
# panicked on an unmountable root. A console would confirm it.
# recipes-kernel/linux/files/0001-*-restore-chosen-bootargs.patch puts
# root=PARTUUID back into the DT, which is Rockchip's own convention for this
# U-Boot.
#
# If U-Boot itself ever needs replacing, the candidate is radxa/u-boot
# next-dev-v2024.10, which despite its name is *also* U-Boot 2017.09 (it has
# make.sh) and carries rk3566-radxa-zero3.dts plus
# radxa-zero3-rk3566_defconfig. Swapping to it means keeping the second `rkbin`
# git entry in SRC_URI (make.sh needs it) and setting RK_UBOOT_CFG plus
# RK_UBOOT_SPL = "1", since radxa's defconfig is SPL+ATF rather than the
# Rockchip Miniloader this recipe defaults to -- and it boots via extlinux, so
# the chosen-node patch above would become redundant.
UBOOT_MACHINE = "rk3568_defconfig"

# microduck_daemon's name for this board (microduck-common.inc, MICRODUCK_BOARD).
MICRODUCK_BOARD = "zero3"

# Two things found by reading radxa-zero3-rk3566_defconfig, both of which bite
# later rather than now:
#
# 1. RAUC's uboot backend needs a *writable U-Boot environment*: none of these
#    Rockchip defconfigs sets CONFIG_ENV_IS_IN_*, and fw_printenv/fw_setenv plus
#    /etc/fw_env.config have to exist on the target. This U-Boot does have its
#    own Android/AVB A/B support (CONFIG_SPL_AB, CONFIG_AVB_LIBAVB_AB), which is
#    a *different* mechanism from the one RAUC drives.
#
#    Corrected 2026-09-17: this note previously also claimed RAUC needs
#    CONFIG_BOOTCOUNT_LIMIT. It does not. `grep -ri bootcount` over RAUC's own
#    documentation returns nothing; the retry counter is BOOT_<slot>_LEFT, an
#    ordinary environment variable that a boot script we write decrements
#    ourselves. RAUC reads it as hex (src/bootloaders/uboot.c uses
#    g_ascii_strtoull(..., 16)), so that script must say 0x${BOOT_A_LEFT}.
#
#    Done 2026-09-21, and it was worse than "not set": with no CONFIG_ENV_*
#    line at all, env/Kconfig's choice falls to CONFIG_ENV_IS_NOWHERE, whose
#    location struct has no .save member -- `saveenv` is a no-op failure and the
#    board has no persistent environment whatsoever. recipes-bsp/u-boot/ now adds
#    CONFIG_ENV_IS_IN_BLK_DEV at CONFIG_ENV_OFFSET=0x3F8000 (the uboot_env
#    partition, Rockchip's documented slot) plus CONFIG_CMD_SETEXPR, and ships the
#    matching /etc/fw_env.config and default env. Verified on hardware 2026-09-25.
#    The layout's first 16 MiB follow Rockchip's table; docs/agents/rauc.md.
#
# 2. CONFIG_DEBUG_UART_BASE=0xFE660000 is RK3566 UART2 -- the motor bus -- at
#    1500000 baud. So U-Boot prints onto the Dynamixel wires at power-on even
#    when MICRODUCK_MOTOR_UART = "1", which only silences Linux. Harmless today
#    (robotd starts much later), but on the custom PCB put the debug UART
#    somewhere else.

# A/B partition layout, replacing meta-rockchip's single-rootfs
# generic-gptdisk.wks.in (rockchip-image.bbclass sets that with ?=, so a plain
# assignment here wins). Every offset and size is explicit; see the file for why,
# and for the measurements each number came from.
#
# It lives in meta-microduck/files/wic/ and not meta-microduck/wic/ because
# oe-core's WKS_SEARCH_PATH is '<layer>/files/wic' for each BBPATH entry.
#
# This layout targets the 32 GB card. Do not flash it to the 2 GB one.
WKS_FILE = "microduck-ab.wks.in"

# The AIC8800 is not in the kernel tree (radxa's or Armbian's) and is not covered by meta-rockchip's
# rkwifibt-firmware (that recipe packages Broadcom AP6xxx and RTL8723DS only), so
# both driver and firmware come from our own recipe.
#
# Deliberately not pulling in rkwifibt-firmware or brcm-tools: those are Broadcom
# and this board has none.
RK_WIFIBT_RRECOMMENDS = "aic8800"
