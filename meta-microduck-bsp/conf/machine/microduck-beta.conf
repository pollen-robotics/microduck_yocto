#@TYPE: Machine
#@NAME: microduck beta (Seeed main board)
#@DESCRIPTION: RK3566, 1 GB LPDDR4X, 64 GB eMMC. The custom microduck PCB, first spin.

require conf/machine/include/rk356x.inc
require conf/machine/include/microduck-common.inc

# Our own DTS, copied into the kernel tree by linux-rockchip_6.1.bbappend.
# What came from the schematic and what from Seeed's DTB: docs/agents/beta-board.md.
MICRODUCK_BOARD_DTS = "rk3566-microduck-beta.dts"
KERNEL_DEVICETREE = "rockchip/rk3566-microduck-beta.dtb"

# microduck_daemon's name for this board (microduck-common.inc, MICRODUCK_BOARD).
MICRODUCK_BOARD = "beta"

# Motors are on UART3 here, so UART2 stays the console (TP83/TP84). The DTS swaps
# the serial aliases so the motor bus is still /dev/ttyS2.
MICRODUCK_MOTOR_UART = "0"

# As on the Zero 3W; the beta's DDR blob is in u-boot-rockchip.bbappend.
UBOOT_MACHINE = "rk3568_defconfig"

# A WL6201S module, which is a WuQi WQ9201S. No AIC8800 attach unit: it would
# grab ttyS1, the WuQi's Bluetooth UART too.
RK_WIFIBT_RRECOMMENDS = "wq9201s"
MICRODUCK_RADIO_PACKAGES = "wq9201s-bt"
MICRODUCK_RADIO_DEV_PACKAGES = ""

# The face-LED, ToF and NFC udev rules need the daemons' groups, so microduck-image
# installs them: a BSP machine conf may not name another layer's recipes.
# Without these the board hangs on reboot, has no way in (USB-C ssh) or runs
# the fan flat out; the rest only degrades (no sound, green picture, CPU detector).
MACHINE_EXTRA_RDEPENDS:append = " microduck-fan microduck-usb-gadget microduck-reboot-voltage"
MACHINE_EXTRA_RRECOMMENDS:append = " microduck-beta-audio microduck-beta-camera librknnrt"
