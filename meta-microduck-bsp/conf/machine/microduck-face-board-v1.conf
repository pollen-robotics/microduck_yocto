#@TYPE: Machine
#@NAME: microduck beta (Seeed main board) with the V1.0 face board
#@DESCRIPTION: The beta main board unchanged; the face board's PCA9535 expander is replaced by Awinic LED drivers.

# The same main board as microduck-beta, so everything that applies to the beta
# (`:microduck-beta` overrides: U-Boot's DDR blob, the kernel fragment, the
# radio, the image's udev rules) applies here too. Only the face block of the
# device tree differs, and the two face boards cannot share a DTB: the V1.0's
# AW21009 sits at the PCA9535's address (0x20 on I2C3) and the AW2023 takes its
# interrupt line (GPIO4_C7). Nothing on the bus tells them apart at boot.
MACHINEOVERRIDES =. "microduck-beta:"
require conf/machine/microduck-beta.conf

# The face board's DTS includes the beta one and swaps the face block, so both
# files go into the kernel tree; only this one's DTB is deployed.
MICRODUCK_BOARD_DTS = "rk3566-microduck-beta.dts rk3566-microduck-face-board-v1.dts"
KERNEL_DEVICETREE = "rockchip/rk3566-microduck-face-board-v1.dtb"

# microduck_daemon's own name for this board (robotd-params Board::FaceBoardV1),
# so robotctl shows the board it is on rather than the beta it is built from.
# A daemon release that predates the name would refuse it and robotd would not
# start, so microduck-board declares the fallback instead when the seeded robotd
# does not know it: the beta, which is what this board was declared before.
MICRODUCK_BOARD = "face-board-v1"
MICRODUCK_BOARD_FALLBACK = "beta"
