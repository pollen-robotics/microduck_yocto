# Network hardware and protocols no microduck has or speaks: wifi is SDIO,
# there is no Ethernet, CAN or modem, and the root is never on the network.
# Rockchip's Broadcom/AP6xxx wifi driver: its sdio:c00v*d* alias matches any
# class-0 SDIO function, so it loaded on the WQ9201S.
# CONFIG_AP6XXX is not set
# CONFIG_R8168 is not set
# CONFIG_R8169 is not set
# CONFIG_STMMAC_ETH is not set
# CONFIG_USB_RTL8150 is not set
# CONFIG_USB_RTL8152 is not set
# CONFIG_CAN is not set
# CONFIG_CAIF is not set
# CONFIG_LTE is not set
# CONFIG_IP_PNP is not set
# CONFIG_IP_VS is not set
# CONFIG_BPFILTER is not set
# CONFIG_NET_KEY is not set
# CONFIG_IP_MROUTE is not set
# CONFIG_IPV6_MROUTE is not set
