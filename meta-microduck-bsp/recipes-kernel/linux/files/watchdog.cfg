# Reboot 10 s after a kernel panic instead of hanging until someone pulls the
# battery. Built in rather than `panic=` on the
# command line or a sysctl, so it holds from the first instruction, before
# U-Boot's bootargs or userspace could set it. Each reboot spends one of
# U-Boot's BOOT_<slot>_LEFT attempts, so a slot on trial that panics falls back.
# The hardware watchdog for hangs that never reach panic() is systemd's
# (recipes-core/systemd/systemd-conf_%.bbappend); its driver, DW_WATCHDOG, is
# already =y in radxa's defconfig.
CONFIG_PANIC_TIMEOUT=10
