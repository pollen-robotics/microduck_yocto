# RK3566's Mali-G52 is a job-manager Bifrost GPU. CSF (Command Stream Frontend)
# is for Valhall CSF parts -- the G610 on RK3588 and similar -- and this SoC has
# no CSF firmware at all.
#
# radxa's rockchip_linux_defconfig turns it on for the whole family anyway
# (CONFIG_MALI_CSF_SUPPORT=y, CONFIG_MALI_CSF_INCLUDE_FW=y), which breaks the
# build. mali_kbase_csf_firmware.c does:
#
#     .incbin "drivers/gpu/arm/bifrost/mali_csffw.bin"
#
# a *source-relative* path. Yocto builds the kernel out of tree (O=), so the
# assembler resolves it against the build directory, where the blob does not
# exist, and fails with "file not found".
#
# Disabling CSF is correct on the merits, not just a build workaround: enabling a
# Valhall-CSF code path on a Bifrost JM GPU is wrong for this SoC either way.
#
# Moot since no-mali-gpu.cfg drops the Bifrost driver altogether (no libmali was
# ever installed, nothing uses the GPU). Kept so that re-enabling Bifrost does not
# bring the broken CSF build back with it.
# CONFIG_MALI_CSF_SUPPORT is not set
# CONFIG_MALI_CSF_INCLUDE_FW is not set
