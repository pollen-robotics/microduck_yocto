# The Nintendo Switch Pro Controller, and the no-name clones of it microduck ships with.
#
# Without hid-nintendo, hid-generic takes the pad and leaves it in its simple HID mode:
# buttons and sticks only. The daemon's IMU support (padd's tap, pad-imu, robotctl
# monitor's IMU panel, the pad-tilt head control) reads the IMU from the second input
# device this driver creates ("... Pro Controller IMU"), so on this image none of it ever
# worked; graphite, an Armbian board with the driver, had it (2026-09-09). Seen on a
# face-board-v1 running microduck OS 20261113111055 (2026-11-17): the pad drove, no IMU.
#
# The driver also gives the pad its player LEDs, its battery as a power_supply (padd
# reads that when it is there, rather than asking the pad itself) and, with NINTENDO_FF,
# rumble. Its dependencies are already =y in radxa-rockchip-linux.kconfig: NEW_LEDS,
# LEDS_CLASS; POWER_SUPPLY and INPUT_FF_MEMLESS are selected. Checked against
# drivers/hid/Kconfig at this tree's SRCREV (e97b8a3f).
#
# Built in, not a module: nothing else on this image loads modules for an input device.
#
# Goes with UserspaceHID=false in meta-microduck's bluez5 append: in full mode the pad
# streams its IMU at ~200 reports/s, and through bluetoothd's userspace HID that cost
# bluetoothd ~16 % CPU with the pad untouched (graphite, 2026-09-09).
CONFIG_HID_NINTENDO=y
CONFIG_NINTENDO_FF=y
