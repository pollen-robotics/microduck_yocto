# No Mali GPU driver: a headless robot that runs no GPU code.
#
# Nothing in the image uses the GPU -- no libmali, EGL, GLES or mesa is installed;
# mediad's `render` group is for the NPU, video goes through MPP and RGA. But the
# driver (Rockchip's kbase, release g29p1) is still reachable by any process in
# the video or render group, mediad included, and Arm's kbase drivers carry
# exploited use-after-frees (CISA KEV: CVE-2023-4211, CVE-2024-4610) whose
# fixed releases cannot be matched to Rockchip's release names. Removing the
# driver removes the question. radxa's defconfig enables both families.
# CONFIG_MALI_BIFROST is not set
# CONFIG_MALI_MIDGARD is not set
