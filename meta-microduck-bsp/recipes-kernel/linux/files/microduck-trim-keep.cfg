# What radxa's defconfig had on only through the select of something a
# microduck-trim-*.cfg turns off. kernel-yocto merges the defconfig in one
# alldefconfig pass, so such an option goes off with its selector, silently.
#
# USB host: the USB touchscreen selected it. wq_wlan links against it (an
# out-of-tree module cannot select anything).
CONFIG_USB=y
# CPU, DDR and bus frequency scaling (rockchip-dmc, rockchip OPP): UFS selected it.
CONFIG_PM_DEVFREQ=y
# /dev/zram0, compressed with lzo-rle by default: UBIFS/JFFS2/F2FS pulled LZO in.
CONFIG_CRYPTO_LZO=y
CONFIG_ZRAM=y
# USB sticks: SATA selected SCSI.
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_USB_STORAGE=y
CONFIG_USB_UAS=y
# Mounted at /sys/kernel/security: the TPM selected it.
CONFIG_SECURITYFS=y
