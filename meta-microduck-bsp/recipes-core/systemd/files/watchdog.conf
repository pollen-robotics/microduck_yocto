# PID 1 feeds the SoC's hardware watchdog (dw_wdt, /dev/watchdog0); if the system
# hangs hard enough that it stops -- a kernel lockup, or PID 1 itself wedged -- the
# watchdog resets the board. 30 s is a request:
# dw_wdt only has power-of-two timeouts and rounds it up, ~45 s here. Measured on a
# Zero 3W with kernel.panic=0 and a sysrq crash: the reset came ~50 s after the
# hang. A kernel panic reboots sooner, on CONFIG_PANIC_TIMEOUT. RebootWatchdogSec is
# left as the image already has it (1 min on that board), which covers a reboot or
# poweroff that hangs. To test it, hang the kernel as above: `kill -STOP 1` does
# nothing, the kernel ignores SIGSTOP sent to PID 1.
[Manager]
RuntimeWatchdogSec=30s
