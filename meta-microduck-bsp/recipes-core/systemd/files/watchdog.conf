# PID 1 feeds the SoC's hardware watchdog (dw_wdt, /dev/watchdog0); if the system
# hangs hard enough that it stops -- a kernel lockup, or PID 1 itself wedged -- the
# watchdog resets the board 30 s later. A kernel
# panic reboots sooner, on CONFIG_PANIC_TIMEOUT. RebootWatchdogSec keeps systemd's
# default (10 min), which covers a reboot or poweroff that hangs.
[Manager]
RuntimeWatchdogSec=30s
