# Poky plus what the robot runs. Rootfs policy goes here;
# kas/microduck.yml is build-host only.

require conf/distro/poky.conf

DISTRO = "microduck"
DISTRO_NAME = "microduck OS"
# The newest OS release, from the tags (scripts/os-release.sh, passed in by the
# build scripts), so /etc/os-release names the OS rather than poky's 6.0.x.
# 0.0.0 from a bare kas build.
MICRODUCK_OS_VERSION ??= "0.0.0"
DISTRO_VERSION = "${MICRODUCK_OS_VERSION}"

# Keep :poky overrides and TARGET_VENDOR -poky (same toolchain, SDK, sstate).
# "microduck" is now taken as an override name.
DISTROOVERRIDES = "poky:microduck"

# meta-rauc's sanity-meta-rauc.bbclass warns on every single parse without
# this. It is not only cosmetic: busybox and curl carry bbappends keyed off
# the feature (tar long options, and nghttp2 so adaptive updates can pipeline
# their range requests).
DISTRO_FEATURES:append = " rauc"

# Headless robot: oe-core default features we opt out of (wrynose's way; :remove
# would also strip a feature something else adds). Each is a knob a recipe reads:
#   x11, wayland  no display server (also drops rockchip-common.inc's XSERVER list)
#   opengl        gstgl was the only thing pulling rockchip-libmali; nothing uses the GPU
#   vulkan        gst-plugins-bad's vulkan plugin, vulkan-loader, shaderc-native
#   pulseaudio    sounds execs aplay; mediad links no pulse crate
#   ptest         test suites built for every recipe, installed by none
#   3g, nfc       packagegroup-base installed ofono and neard on these alone
#   debuginfod    client for a server we do not run
#   nfs           rpcbind listening on :111 via packagegroup-base-nfs
#   zeroconf      avahi-daemon answering mDNS on :5353 via packagegroup-base-zeroconf.
#                 A robot is found by the IP btd advertises over BLE (duckctl ip).
DISTRO_FEATURES_OPTED_OUT = "x11 wayland opengl vulkan pulseaudio ptest 3g nfc debuginfod nfs zeroconf"

IMAGE_LINGUAS = "en-us"

# meta-rockchip repoints xserver-xorg and weston at JeffyCN forks with
# SRCREV = "${AUTOREV}" and, for xserver, a ${PV}-derived branch name. Both
# are problems:
#
#  - AUTOREV means a git ls-remote on every parse and a build that cannot be
#    reproduced, which defeats the reason we pin every layer to a commit.
#  - The xserver tag it derives, 21.1.22_2025_11_06, does not exist: the fork
#    stops at 21.1.21 while oe-core wrynose ships xserver-xorg 21.1.22. That
#    is a hard parse failure for the whole tree, not just for X.
#
# We need neither a display server: M5's GStreamer path is kmssrc, which
# wants libdrm, not X or Weston. Mask both bbappends.
#
# Revisit if a display is ever added -- masking the bbappend means losing
# meta-rockchip's Rockchip-specific patches along with the breakage.
BBMASK += "meta-rockchip/recipes-graphics/(xorg-xserver|wayland/weston)"

INIT_MANAGER = "systemd"

# NetworkManager owns the network, and only NetworkManager.
#
# docs/architecture.md:190 in microduck_daemon fixes this choice: "Wifi
# credentials | NetworkManager | We never store them; clients drive NM via its
# DBus API." wpa-supplicant stays -- NM has no supplicant of its own and drives
# wpa_supplicant over D-Bus, so dropping it would break wifi entirely.
#
# What has to go is systemd's own stack. INIT_MANAGER = "systemd" otherwise
# installs *and enables* systemd-networkd and systemd-resolved next to NM:
# two daemons managing the same interfaces, and two competing wait-online
# units both gating network-online.target -- which updaterd.service depends
# on, so a networkd wait-online that never settles stalls the updater on a
# board whose wifi is fine.
# nss-resolve has to go with resolved: oe-core enables it by default and
# systemd's meson refuses the combination --
#   "nss-resolve is requested but resolve is disabled"
# Nothing in systemd's PACKAGECONFIG depends on networkd. Without nss-resolve
# glibc just uses /etc/resolv.conf, which NetworkManager writes itself.
#
# vconsole too: systemd-vconsole-setup loads a keymap and font on the screen
# console at boot, and pulls kbd (2.7 MiB of keymaps and fonts) for it. Nobody
# types on a robot's screen console; serial and ssh use neither.
VIRTUAL-RUNTIME_net_manager = "networkmanager"
PACKAGECONFIG:remove:pn-systemd = "networkd resolved nss-resolve vconsole"

# No ICU: 38 MiB (libicudata alone is 32) for two users that do not need it.
# - bluez5's OBEX (obexd: classic-BT file transfer) pulls libical, which links
#   ICU. The robot speaks BLE GATT through btd and never transfers files.
# - libpsl (via libsoup, libcurl, gnutls) defaults to ICU for IDNA; libidn2 does
#   the same job and is in the image already, for curl and gnutls.
PACKAGECONFIG:remove:pn-bluez5 = "obex-profiles"
PACKAGECONFIG:pn-libpsl = "idn2"

# NetworkManager's crypto backend: gnutls, already in the image, instead of the
# default nss -- 15 MiB that nothing else uses. It covers certificates and keys
# for 802.1x and VPNs; wifi passphrases are wpa_supplicant's job either way.
PACKAGECONFIG:remove:pn-networkmanager = "nss"
PACKAGECONFIG:append:pn-networkmanager = " gnutls"

# Poky defaults a robot should not run; scripts/qemu-test.sh guards them.

# busybox-syslog, a second logger next to journald. default-providers.inc sets
# VIRTUAL-RUNTIME_base-utils-syslog ?= "busybox-syslog". microduck_daemon
# ships a journald drop-in with Storage=persistent and ForwardToSyslog=no, so
# journald is the log store and syslog is dead weight. /var/log itself is
# oe-core's tmpfs symlink; the journal under it is bind-mounted from the data
# partition by recipes-core/microduck-data.
VIRTUAL-RUNTIME_base-utils-syslog = ""

# dnsmasq.service, a general-purpose DNS/DHCP server. The *binary* is wanted:
# NetworkManager needs it for shared/hotspot connections, which is how wifi
# provisioning will work (Reachy Mini's equivalent drives `nmcli Hotspot`).
# But NM spawns its own instance, so the standalone service should not be
# listening. Keep the package, disable the unit.
SYSTEMD_AUTO_ENABLE:pn-dnsmasq = "disable"
