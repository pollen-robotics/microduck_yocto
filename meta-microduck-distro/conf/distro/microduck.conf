# Poky plus what the robot runs. Rootfs policy goes here;
# kas/microduck.yml is build-host only.

require conf/distro/poky.conf

DISTRO = "microduck"
DISTRO_NAME = "microduck OS"
# DISTRO_VERSION stays poky's: the release number is chosen at promotion, so
# each image writes its build id instead (microduck_build_id, microduck-image.bb).

# Keep :poky overrides and TARGET_VENDOR -poky (same toolchain, SDK, sstate).
DISTROOVERRIDES = "poky:microduck"

# Not cosmetic: busybox and curl bbappends key off it (tar long options, nghttp2
# for adaptive updates' range requests).
DISTRO_FEATURES:append = " rauc"

# Headless robot. Opted out rather than :remove, which would also strip a
# feature something else adds. Each one removed a package or a listener:
#   opengl     gstgl was all that pulled rockchip-libmali
#   3g, nfc    ofono and neard, via packagegroup-base
#   nfs        rpcbind on :111
#   zeroconf   avahi on :5353; `duckctl ip` uses BLE, not mDNS
DISTRO_FEATURES_OPTED_OUT = "x11 wayland opengl vulkan pulseaudio ptest 3g nfc debuginfod nfs zeroconf"

IMAGE_LINGUAS = "en-us"

# meta-rockchip's xserver/weston appends use AUTOREV, and the xserver tag they
# derive does not exist: a parse failure for the whole tree. No display here;
# adding one means losing meta-rockchip's Rockchip patches for X and Weston too.
BBMASK += "meta-rockchip/recipes-graphics/(xorg-xserver|wayland/weston)"

INIT_MANAGER = "systemd"

# NetworkManager owns the network. networkd's wait-online would also gate
# network-online.target, which updaterd waits on. nss-resolve goes with resolved
# (meson refuses it alone); vconsole pulled 2.7 MiB of kbd for no screen.
VIRTUAL-RUNTIME_net_manager = "networkmanager"
PACKAGECONFIG:remove:pn-systemd = "networkd resolved nss-resolve vconsole"

# No ICU (38 MiB): obexd's libical links it, and libpsl does IDNA with idn2 instead.
PACKAGECONFIG:remove:pn-bluez5 = "obex-profiles"
PACKAGECONFIG:pn-libpsl = "idn2"

# gnutls, already in the image, instead of nss: 15 MiB nothing else uses.
PACKAGECONFIG:remove:pn-networkmanager = "nss"
PACKAGECONFIG:append:pn-networkmanager = " gnutls"

# Poky defaults a robot should not run; scripts/qemu-test.sh guards them.

# journald is the log store (the daemon sets ForwardToSyslog=no).
VIRTUAL-RUNTIME_base-utils-syslog = ""

# NetworkManager runs its own dnsmasq for shared connections: keep the binary,
# not the standalone service.
SYSTEMD_AUTO_ENABLE:pn-dnsmasq = "disable"

# Every QA warning fails the build: sstate never prints a warning a second time.
ERROR_QA:append = " ${WARN_QA}"
