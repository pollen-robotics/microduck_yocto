# sshd.socket on the head USB-C link only: 192.168.42.1, the robot's end of
# microduck-usb-gadget's NCM link.
#
# BindToDevice=usb0 is what keeps wifi out. Linux accepts a packet for any of
# its addresses on any interface, so the address alone would still answer a
# wifi peer routing 192.168.42.1 via the robot. FreeBind lets the socket bind
# before usb0 has the address.
#
# BindToDevice also makes the socket wait for the usb0 device, which appears
# only once microduck-usb-gadget.service runs, after basic.target. A socket
# normally holds up sockets.target and so basic.target: boot would stall on the
# 90 s device timeout, then fail the socket (scripts/test-ssh-access.sh).
# Hence no default dependencies; the usb0 device's wants link starts the socket
# whenever usb0 appears.
#
# 30-wifi-until-reboot.conf resets every key in [Socket] here: keep them in step.
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target

[Socket]
ListenStream=
ListenStream=192.168.42.1:22
BindToDevice=usb0
FreeBind=yes
