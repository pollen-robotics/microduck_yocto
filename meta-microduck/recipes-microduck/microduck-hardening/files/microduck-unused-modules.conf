# Kernel modules a robot never uses, made unloadable.
#
# Built as modules by radxa's defconfig and installed with kernel-modules, they
# load on demand -- and CONFIG_USER_NS=y lets an unprivileged process create a
# network namespace and ask for them (a bridge, a qdisc, a tc filter). Most
# kernel network exploits of the last years went through exactly these:
# ebtables (CVE-2026-53266), tc classifiers (cls_u32, cls_route), the qfq and
# hfsc schedulers. `install ... /bin/false` refuses a load whoever asks,
# root included; `blacklist` would only stop alias-based autoloading.
#
# Not here, on purpose: sch_fq_codel, sch_fq and sch_codel. systemd sets
# net.core.default_qdisc = fq_codel, so the kernel loads it for every interface.
# Nothing in the image runs tc, brctl, an L2TP or PPP link, or a VM socket.

# Bridging and ebtables; ebt_*, ebtable_* and nft_*_bridge need these to load.
install bridge /bin/false
install br_netfilter /bin/false
install ebtables /bin/false

# Traffic control: queueing disciplines (all but the default fq_codel family),
# classifiers, actions and ematches.
install sch_choke /bin/false
install sch_drr /bin/false
install sch_gred /bin/false
install sch_hfsc /bin/false
install sch_hhf /bin/false
install sch_htb /bin/false
install sch_mqprio /bin/false
install sch_multiq /bin/false
install sch_netem /bin/false
install sch_pie /bin/false
install sch_plug /bin/false
install sch_prio /bin/false
install sch_qfq /bin/false
install sch_red /bin/false
install sch_sfb /bin/false
install sch_sfq /bin/false
install sch_tbf /bin/false
install sch_teql /bin/false
install cls_basic /bin/false
install cls_bpf /bin/false
install cls_cgroup /bin/false
install cls_flow /bin/false
install cls_flower /bin/false
install cls_route /bin/false
install cls_u32 /bin/false
install act_csum /bin/false
install act_gact /bin/false
install act_ipt /bin/false
install act_mirred /bin/false
install act_nat /bin/false
install act_pedit /bin/false
install act_police /bin/false
install act_simple /bin/false
install act_skbedit /bin/false
install em_cmp /bin/false
install em_ipset /bin/false
install em_meta /bin/false
install em_nbyte /bin/false
install em_text /bin/false
install em_u32 /bin/false

# Protocols with no use on a robot. Kernel SCTP is not WebRTC's: data channels
# run GStreamer's own SCTP over DTLS, in user space.
install sctp /bin/false
install l2tp_core /bin/false
install atm /bin/false
install ieee802154 /bin/false
install 6lowpan /bin/false
install vsock /bin/false
install ppp_generic /bin/false
