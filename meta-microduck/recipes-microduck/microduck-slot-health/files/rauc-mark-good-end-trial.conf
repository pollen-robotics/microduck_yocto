# Once RAUC has marked the booted slot good, end its trial: BOOT_ORDER names it
# alone, so later boots that die early can no longer push the robot onto the other
# slot. See /usr/libexec/microduck-slot-trial.
#
# A drop-in, not a unit of its own: ExecStartPost= runs only if `rauc status
# mark-good` succeeded, and adds no ordering edge. A new unit around boot-complete
# is how the board once got an ordering cycle that silently dropped slot-health
# (microduck-osupdate-report.service has that story).
[Service]
ExecStartPost=/usr/libexec/microduck-slot-trial
