# Generate the host keys once the data partition is mounted, so they land on it
# (OPENSSH_HOST_KEY_DIR, openssh_%.bbappend).
#
# Ordered after it, never dependent on it: ssh is how a broken robot gets
# repaired, so a data partition that fails to mount must not take sshd down too.
# RequiresMountsFor= would make it a Requires=. Without the mount, the keys go to
# the rootfs directory underneath and ssh still works.
[Unit]
Wants=var-lib-robot.mount
After=var-lib-robot.mount
